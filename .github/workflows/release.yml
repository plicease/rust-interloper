name: Release

on:
  push:
    branches: [main]


concurrency: release-${{ github.ref }}


permissions:
  contents: write


jobs:
  release:
    uses: uperl/action-rust-release-bin/.github/workflows/release.yml@v1
    with:
      publisher: "plicease"
      # Linux only: Interloper needs termios, so there is no Windows build.
      targets: >-
        {"include":[
        {"target":"x86_64-unknown-linux-gnu","os":"ubuntu-latest"},
        {"target":"i686-unknown-linux-gnu","os":"ubuntu-latest"},
        {"target":"aarch64-unknown-linux-gnu","os":"ubuntu-latest"}
        ]}

