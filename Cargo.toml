[package]
name = "interloper"
version = "0.2.0"
edition = "2024"
description = "INTERLINK for Linux"
repository = "https://github.com/plicease/rust-interloper"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
nix = { version = "0.31", features = ["term", "poll", "fs"] }


[package.metadata.deb]
maintainer = "Graham Ollis <plicease@cpan.org>"
copyright = "Nobody"
extended-description = """\
INTERLINK for Linux"""
section = "utils"
priority = "optional"
assets = [
    ["target/release/interloper", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/interloper/README.md", "644"],
    ["LICENSE", "usr/share/doc/interloper/LICENSE", "644"],
]

